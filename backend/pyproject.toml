[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gielis-geometry-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.1,<3",
]

[tool.setuptools]
packages = ["gielis_geometry", "gielis_api"]

[project.optional-dependencies]
# Servidor web: pip install -e ".[api,test]"
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
