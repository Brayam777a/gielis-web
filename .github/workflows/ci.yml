name: CI (Backend + Frontend)

on:
  push:
    branches: [main, Rama-Miguel2]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,test]"
      - name: Comprobar sintaxis y diagnostico
        run: |
          python -W error -m py_compile check_env.py gielis_api/main.py gielis_api/jobs.py gielis_api/cst/simulator.py
          python check_env.py --json
      - name: Ejecutar pruebas backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
